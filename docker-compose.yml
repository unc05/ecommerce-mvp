version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecommerce_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres123@postgres_db:5432/ecommerce_db?schema=public"
      JWT_SECRET: "super_secret_jwt_key_ecommerce_2026"
      JWT_EXPIRES_IN: "1d"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
